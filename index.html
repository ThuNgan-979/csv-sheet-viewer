<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Sheet Viewer & Instant Multi-Filter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121318; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }
    
    .sidebar { width: 320px; background: #1a1b23; padding: 20px; border-right: 1px solid #2d2e3d; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .sidebar h2 { font-size: 16px; color: #4da6ff; display: flex; align-items: center; gap: 8px; }
    .btn-reset { background: #ff4d4f22; color: #ff4d4f; border: 1px solid #ff4d4f44; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-reset:hover { background: #ff4d4f44; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-group label { font-size: 12px; color: #888; }
    .filter-group input { background: #252633; border: 1px solid #36374a; color: #fff; padding: 8px 10px; border-radius: 6px; outline: none; }
    .filter-group input:focus { border-color: #4da6ff; }

    .main-content { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #1a1b23; padding: 12px 20px; border-radius: 8px; border: 1px solid #2d2e3d; }
    .stats { display: flex; gap: 15px; font-size: 14px; align-items: center; }
    .badge { background: #252633; padding: 4px 10px; border-radius: 4px; border: 1px solid #36374a; }
    .badge-highlight { color: #4da6ff; font-weight: bold; }
    
    .btn-file { background: #0066cc; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-file:hover { background: #0052a3; }
    #csv-file { display: none; }

    .table-container { flex: 1; overflow: auto; border: 1px solid #2d2e3d; border-radius: 8px; background: #1a1b23; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; text-align: left; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #2d2e3d; border-right: 1px solid #2d2e3d; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
    th { background: #222330; color: #aaa; position: sticky; top: 0; z-index: 10; font-weight: 600; }
    tr:hover { background: #25263a; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>⚡ Bộ Lọc Tìm Kiếm</h2>
    <button class="btn-reset" onclick="resetFilters()">🗑️ Xoá toàn bộ bộ lọc</button>
    <div id="filter-inputs"></div>
  </div>

  <div class="main-content">
    <div class="header-bar">
      <div class="stats">
        <span class="badge">📊 File: <strong id="file-name">Chưa chọn file</strong></span>
        <span class="badge">Tổng: <strong id="total-rows">0</strong> dòng</span>
        <span class="badge">Khớp: <strong id="matched-rows" class="badge-highlight">0</strong> dòng</span>
      </div>
      <div>
        <label for="csv-file" class="btn-file">📁 Tải file CSV lên</label>
        <input type="file" id="csv-file" accept=".csv">
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead><tr id="table-head"></tr></thead>
        <tbody id="table-body">
          <tr><td style="text-align: center; padding: 40px;" colspan="100">Hãy chọn 1 file CSV để bắt đầu xem dữ liệu...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let rawData = [];
    let headers = [];
    let filteredData = [];

    const filterContainer = document.getElementById('filter-inputs');
    for (let i = 1; i <= 12; i++) {
      filterContainer.innerHTML += `
        <div class="filter-group">
          <label>Từ khoá #${i}</label>
          <input type="text" class="filter-input" placeholder="Nhập từ khoá #${i}..." oninput="applyFilters()">
        </div>
      `;
    }

    document.getElementById('csv-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('file-name').innerText = file.name;
      document.getElementById('table-body').innerHTML = '<tr><td style="text-align: center; padding: 40px;" colspan="100">Đang đọc file CSV...</td></tr>';

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          headers = results.meta.fields || [];
          rawData = results.data;
          filteredData = rawData;

          document.getElementById('total-rows').innerText = rawData.length.toLocaleString();
          renderHeader();
          applyFilters();
        }
      });
    });

    function renderHeader() {
      document.getElementById('table-head').innerHTML = '<th>#</th>' + headers.map(h => `<th>${h}</th>`).join('');
    }

    function applyFilters() {
      const inputs = Array.from(document.querySelectorAll('.filter-input'))
                          .map(i => i.value.toLowerCase().trim())
                          .filter(val => val !== '');

      if (inputs.length === 0) {
        filteredData = rawData;
      } else {
        filteredData = rawData.filter(row => {
          const rowText = Object.values(row).join(' ').toLowerCase();
          return inputs.every(keyword => rowText.includes(keyword));
        });
      }

      document.getElementById('matched-rows').innerText = filteredData.length.toLocaleString();
      renderTableBody(filteredData);
    }

    function renderTableBody(data) {
      const bodyEl = document.getElementById('table-body');
      if (data.length === 0) {
        bodyEl.innerHTML = '<tr><td style="text-align: center; padding: 40px;" colspan="100">Không tìm thấy kết quả phù hợp</td></tr>';
        return;
      }

      const limit = Math.min(data.length, 100);
      let html = '';
      for (let i = 0; i < limit; i++) {
        const row = data[i];
        html += `<tr><td>${i + 1}</td>` + headers.map(h => `<td title="${row[h] || ''}">${row[h] || ''}</td>`).join('') + '</tr>';
      }
      bodyEl.innerHTML = html;
    }

    function resetFilters() {
      document.querySelectorAll('.filter-input').forEach(input => input.value = '');
      applyFilters();
    }
  </script>
</body>
</html>
